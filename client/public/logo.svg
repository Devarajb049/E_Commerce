<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <!-- Hand Clicker Symbol -->
  <g transform="translate(4, 0)">
    <!-- Interactive Button Target with Click Ring Accents -->
    <circle cx="21" cy="11" r="5" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" />
    <circle cx="21" cy="11" r="2.5" fill="#F97316" />
    
    <!-- Subtle Click Radiating Waves -->
    <path d="M14 6C16.1 4.5 18.5 3.7 21 3.7C23.5 3.7 25.9 4.5 28 6" 
          stroke="#F97316" stroke-width="1.75" stroke-linecap="round" opacity="0.85" />
    <path d="M11 9C12.5 7.5 14.5 6.4 16.7 5.7" 
          stroke="#F97316" stroke-width="1.75" stroke-linecap="round" opacity="0.6" />
    <path d="M31.3 5.7C33.5 6.4 35.5 7.5 37 9" 
          stroke="#F97316" stroke-width="1.75" stroke-linecap="round" opacity="0.6" />

    <!-- Modern Geometric Hand Cursor with Extended Index Finger Clicking Button -->
    <path d="M21 11V26C21 27.1 20.1 28 19 28C17.9 28 17 27.1 17 26V18.5C17 17.7 16.3 17 15.5 17C14.7 17 14 17.7 14 18.5V28C14 28.5 13.8 30.5 12.3 32L9.5 29.2C8.9 28.6 7.9 28.6 7.3 29.2C6.7 29.8 6.7 30.8 7.3 31.4L13.2 38.3C15.1 40.5 17.9 42 21 42H30C34.4 42 38 38.4 38 34V27.5C38 26.4 37.1 25.5 36 25.5C34.9 25.5 34 26.4 34 27.5V26.5C34 25.4 33.1 24.5 32 24.5C30.9 24.5 30 25.4 30 26.5V25.5C30 24.4 29.1 23.5 28 23.5C26.9 23.5 26 24.4 26 25.5V11C26 9.6 24.9 8.5 23.5 8.5C22.1 8.5 21 9.6 21 11Z"
          fill="#4F46E5"
          stroke="#3730A3"
          stroke-width="1.5"
          stroke-linejoin="round" />

    <!-- Visual Accent on Hand -->
    <path d="M23.5 13V24" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark: ClickKart -->
  <text x="56" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#111827" letter-spacing="-0.5">
    Click<tspan fill="#4F46E5">Kart</tspan>
  </text>
  <!-- Tagline: Shop in a Click -->
  <text x="56" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#F97316" letter-spacing="0.4">
    SHOP IN A CLICK
  </text>
</svg>
